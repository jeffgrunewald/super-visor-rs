[package]
name = "super-visor"
version = "0.4.0"
authors = ["Jeff Grunewald <jeff@grunewalddesign.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Erlang/OTP-style supervision trees for long-running tokio processes"
repository = "https://github.com/jeffgrunewald/super-visor-rs"
keywords = ["async", "supervisor", "otp", "restart", "tokio"]
categories = ["asynchronous", "concurrency"]
edition = "2021"

[dependencies]
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "signal", "rt", "time"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "test-util", "time"] }
